# Builds, vets and runs the unit tests on every pull request and push to main. The tests use an
# in-memory fake of the Clara API, so they need no credentials.
name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./... -count=1

      - name: Docs are up to date
        run: |
          go generate ./...
          git diff --exit-code -- docs/
